name: Docker Build Test

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: self-hosted

    steps:
      # 1. FIX DUBIOUS OWNERSHIP ERROR BEFORE CHECKOUT
      - name: Disable Git dubious ownership check
        run: git config --global --add safe.directory "*"

      # 2. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Build Docker Image
      - name: Build Docker image
        run: docker build -t nodeapp:test .

      # 4. Verify
      - name: Verify Docker image
        run: docker images nodeapp:test

      # 5. DEVSECOPS SCAN (Using Local Trivy + PowerShell Upload)
      - name: Run DevSecOps Pipeline Scan
        env:
          DEVSECOPS_TOKEN: ${{ secrets.DEVSECOPS_TOKEN }}
        run: |
          Write-Output "[DEVSECOPS] Pinging DevSecOps UCP to establish connection..."
          try {
              $pingResponse = Invoke-RestMethod -Uri "https://devsechub.in/api/v1/integrations/cli/ping" -Method Post -Headers @{ "Authorization" = "Bearer $env:DEVSECOPS_TOKEN"; "Content-Type" = "application/json" } -Body "{ `"token`": `"$env:DEVSECOPS_TOKEN`" }"
              Write-Output "[DEVSECOPS] Successfully Connected!"
          } catch {
              Write-Warning "Ping failed: $($_.Exception.Message)"
          }

          Write-Output "[DEVSECOPS] Scanning container image..."
          trivy image --format json -o trivy-report.json nodeapp:test
          
          Write-Output "[DEVSECOPS] Uploading scan results to DevSecOps UCP..."
          try {
              $response = Invoke-WebRequest -Uri "https://devsechub.in/api/v1/integrations/cli/upload" -Method Post -Headers @{ "Authorization" = "Bearer $env:DEVSECOPS_TOKEN"; "Content-Type" = "application/json" } -InFile "trivy-report.json"
              Write-Output "[DEVSECOPS] Scan complete and uploaded successfully!"
          } catch {
              # Check if it was specifically a 406 Blocked error
              if ($null -ne $_.Exception.Response -and $_.Exception.Response.StatusCode.value__ -eq 406) {
                  Write-Error "🛑 PIPELINE BLOCKED BY SECURITY POLICY 🛑 - Vulnerabilities violate blocking rules."
                  exit 1
              }
              
              # Print the ACTUAL error message (e.g. invalid token format, connection lost)
              Write-Error "Failed to upload results: $($_.Exception.Message)"
              exit 1
          }

      # 6. Cleanup (Using continue-on-error instead of bash syntax)
      - name: Remove Docker image
        if: always()
        continue-on-error: true
        run: docker rmi nodeapp:test -f
